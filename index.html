<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F172A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vitvarukollen">
<title>Vitvarukollen</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
/* VOICE: lugn, saklig hushållsassistent – ett svar på tre sekunder
   IDEA: maskinens egen display – det man ska knappa in står störst
   PICTURE: beslutskortet med inställningen och prisgrafen
   COLOUR/TYPE: Dark Slate (#0F172A/#1E293B), smaragd = billigt, bärnsten/korall = dyrt; systemfont, tabellsiffror
   LAYOUT: en kolumn, fast bottenmeny, 3 vyer */
:root{color-scheme:dark;--bg:#0F172A;--card:#1E293B;--card2:#172033;--line:#334155;--ink:#E2E8F0;--mute:#94A3B8;--dim:#64748B;
  --green:#10B981;--green2:#064E3B;--amber:#F59E0B;--red:#EF4444;--blue:#60A5FA;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;overflow-x:clip;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
main{max-width:560px;margin:0 auto;padding:calc(var(--safe-t) + 12px) 14px calc(var(--safe-b) + 92px)}
.view[hidden]{display:none}
/* topp */
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.top h1{font-size:24px;line-height:1.1;margin:0;font-weight:750;letter-spacing:-.01em}
.sync{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mute);margin-top:3px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--amber);flex:none}.dot.ok{background:var(--green)}.dot.bad{background:var(--red)}
.iconbtn{margin-left:auto;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn svg{width:20px;height:20px}.iconbtn.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* flikar & piller */
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:10px}
.seg button{min-height:40px;border:0;border-radius:10px;background:none;color:var(--mute);font-weight:600;font-size:15px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.pills{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}.pills::-webkit-scrollbar{display:none}
.pill{flex:none;display:flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.pill[aria-pressed=true]{border-color:var(--green);color:var(--green);background:rgba(16,185,129,.1)}
.pill select{appearance:none;-webkit-appearance:none;background:none;border:0;font-weight:600;padding:0;cursor:pointer}
.pill input[type=time]{background:none;border:0;padding:0;width:5.2em}
/* beslutskort */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.decision{border-width:2px}
.decision.wait{border-color:var(--amber)}.decision.go{border-color:var(--green)}.decision.none{border-color:var(--line)}
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:13px;font-weight:700}
.badge.wait{background:rgba(245,158,11,.15);color:var(--amber)}.badge.go{background:rgba(16,185,129,.15);color:var(--green)}.badge.none{background:#33415566;color:var(--mute)}
.action{font-size:clamp(34px,10vw,46px);line-height:1.05;font-weight:800;letter-spacing:-.02em;margin:10px 0 4px}
.when{color:var(--mute);font-size:15px}
.when b{color:var(--ink);font-weight:600}
.amounts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 6px}
.amounts div{background:var(--card2);border-radius:12px;padding:10px 12px}
.amounts small{display:block;color:var(--mute);font-size:13px}
.amounts strong{font-size:24px;font-weight:750;white-space:nowrap}
.amounts .best strong{color:var(--green)}
.save{display:inline-block;margin-top:4px;padding:3px 10px;border-radius:999px;background:var(--green2);color:#A7F3D0;font-size:13px;font-weight:700;white-space:nowrap}
.valid{font-size:13px;color:var(--dim);margin-top:6px}
.tips{margin-top:12px;border-top:1px solid var(--line);padding-top:10px;display:grid;gap:8px}
.tip{display:flex;gap:8px;font-size:14px;color:#CBD5E1}.tip i{font-style:normal;flex:none;width:20px;text-align:center}
.row2{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn{min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--card2);font-weight:650;cursor:pointer}
.btn.primary{background:var(--green);border-color:var(--green);color:#022C22}
.btn:disabled{opacity:.5}
/* programjämförelse */
.ptable h2,.card h2{font-size:15px;margin:0 0 8px;font-weight:700}
.thead{display:grid;grid-template-columns:minmax(0,1fr) 72px 84px;gap:8px;font-size:12px;color:var(--dim);padding:0 10px 4px}
.thead span:not(:first-child),.prow .n,.prow .b{text-align:right}
.prow{display:grid;grid-template-columns:minmax(0,1fr) 72px 84px;gap:8px;align-items:center;width:100%;text-align:left;border:1px solid transparent;background:var(--card2);border-radius:12px;padding:10px;margin-bottom:6px;cursor:pointer;min-height:52px}
.prow.active{border-color:var(--green);box-shadow:inset 0 0 0 1px var(--green)}
.prow .nm{font-weight:650;font-size:15px;line-height:1.25}
.prow .meta{font-size:12px;color:var(--mute);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tag{font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;white-space:nowrap}
.tag.low{background:var(--green2);color:#A7F3D0}.tag.act{background:var(--green);color:#022C22}
.prow .n{font-size:15px;white-space:nowrap}
.prow .b{font-size:15px;font-weight:700;color:var(--green);white-space:nowrap}
.prow .b small{display:block;font-size:11px;font-weight:500;color:var(--mute)}
.more{width:100%;min-height:44px;border:1px dashed var(--line);border-radius:12px;background:none;color:var(--mute);font-weight:600;cursor:pointer}
.savings{display:flex;justify-content:space-between;align-items:center;gap:10px}
.savings strong{font-size:22px;color:var(--green)}
.foot{font-size:12px;color:var(--dim);text-align:center;margin:18px 0}.foot a{color:var(--mute)}
/* graf */
.fig{position:relative;height:260px;touch-action:none;user-select:none}
.fig svg{position:absolute;inset:0;width:100%;height:100%}
.sel{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.sel strong{font-size:22px}
.minmax{display:grid;gap:8px}
.minmax div{display:flex;justify-content:space-between;gap:8px;background:var(--card2);border-radius:12px;padding:10px 12px;font-size:15px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin-top:8px}.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--c)}
/* inställningar */
.field{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.field:last-child{border-bottom:0}
.field label{font-size:15px}.field .hint{grid-column:1/-1;font-size:12px;color:var(--dim);margin-top:-2px}
.inp{display:flex;align-items:center;gap:6px}
.inp input[type=number],.inp input[type=time]{width:92px;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card2);padding:0 10px;font-size:16px;text-align:right}
.inp .u{font-size:13px;color:var(--mute);white-space:nowrap}
.chk{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mute);grid-column:1/-1;justify-self:end;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--green)}
.chk input.switch{width:50px;height:30px;flex:none}
.switch{appearance:none;-webkit-appearance:none;width:50px;height:30px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
.switch:checked{background:var(--green)}.switch:checked::after{transform:translateX(20px)}
.mini{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.mini button{min-height:40px;padding:0 10px;border:0;background:var(--card2);color:var(--mute);font-size:13px;font-weight:600;cursor:pointer}
.mini button[aria-pressed=true]{background:var(--green);color:#022C22}
details{border-top:1px solid var(--line);padding-top:6px;margin-top:6px}
summary{min-height:44px;display:flex;align-items:center;cursor:pointer;font-weight:600}
.sumline{background:var(--card2);border-radius:12px;padding:10px 12px;font-size:14px;color:#CBD5E1;margin-top:8px}
.inp input[type=time]{width:128px;text-align:center;padding:0 6px}
textarea{width:100%;min-height:80px;border-radius:12px;border:1px solid var(--line);background:var(--card2);padding:10px;font-size:14px}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
/* banner, toast, meny */
.banner{border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:14px}
.banner.warn{background:rgba(245,158,11,.12);border:1px solid var(--amber)}
.banner.info{background:rgba(96,165,250,.1);border:1px solid var(--blue)}
.banner .row2{margin-top:8px}
.toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 84px);transform:translateX(-50%);background:#F8FAFC;color:#0F172A;padding:10px 14px;border-radius:12px;font-size:14px;font-weight:600;display:flex;gap:12px;align-items:center;box-shadow:0 8px 24px #0008;z-index:20;max-width:calc(100% - 28px)}
.toast button{border:0;background:none;color:#047857;font-weight:800;cursor:pointer;min-height:32px}
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(15,23,42,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:var(--safe-b);z-index:10}
nav div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
nav button{min-height:62px;border:0;background:none;color:var(--dim);display:grid;justify-items:center;align-content:center;gap:3px;font-size:12px;font-weight:600;cursor:pointer}
nav button svg{width:22px;height:22px}
nav button[aria-current=page]{color:var(--green)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
  <div id="banner"></div>

  <section class="view" id="v-run">
    <div class="top">
      <div><h1>Vitvarukollen</h1><div class="sync"><span class="dot" id="sdot"></span><span id="stext">Hämtar priser…</span></div></div>
      <button class="iconbtn" id="refresh" aria-label="Uppdatera priser"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5"/></svg></button>
    </div>
    <div class="seg" id="machines" role="group" aria-label="Maskin"></div>
    <div class="pills" id="pills"></div>
    <div id="decision"></div>
    <div class="card ptable" id="ptable"></div>
    <div id="savings"></div>
  </section>

  <section class="view" id="v-graph" hidden>
    <div class="top"><div><h1>Prisgraf <span id="garea">SE3</span></h1><div class="sync">Totalpris kr/kWh inkl. moms, skatt &amp; avgifter</div></div></div>
    <div class="card">
      <div class="fig" id="fig"><svg id="chart" aria-label="Kvartspriser"></svg></div>
      <div class="legend"><span style="--c:#10B981">Billigast 25 %</span><span style="--c:#475569">Mellan</span><span style="--c:#F59E0B">Dyrast 25 %</span><span style="--c:#EF4444">Dyrast 10 %</span></div>
    </div>
    <div class="card" id="gsel"></div>
    <div class="card minmax" id="gsum"></div>
  </section>

  <section class="view" id="v-set" hidden>
    <div class="top"><div><h1>Inställningar</h1><div class="sync">Sparas bara i den här telefonen</div></div></div>
    <div id="settings"></div>
  </section>

  <p class="foot">Elpriser tillhandahålls av <a href="https://www.elprisetjustnu.se" target="_blank" rel="noopener">Elpriset just nu.se</a></p>
</main>

<nav><div>
  <button data-view="run" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Kör nu</button>
  <button data-view="graph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M9 20V4M14 20v-7M19 20V8"/></svg>Prisgraf</button>
  <button data-view="set"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Inställningar</button>
</div></nav>
<div id="toast"></div>

<script src="appliances.js"></script>
<script src="app.js"></script>
</body>
</html>
